name: build

on:
  push:
    branches:
      - master

jobs:
  msys2:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sys: "mingw64"
            os: "windows-latest"
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          update: true
          pacboy: ffmpeg

      - name: breakpoint
        uses: fawazahmed0/action-debug-vscode@main

      - name: Test ffmpeg output
        run: |
          ./test.sh
